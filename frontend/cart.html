<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - The Dark Emporium</title>
    <link rel="stylesheet" href="products.css">
</head>

<body>
<!-- This page lets shoppers review cart items, update quantity, and complete a sale. -->
<h1>Your Cart</h1>
<a href="index.html" class="logo">&#9883; Home</a>

<table>

<thead>
<tr>

<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
<th>Remove</th>

</tr>
</thead>

<tbody id="cart-items">
</tbody>

</table>

<h2 id="cart-total"></h2>
<!-- new checkout section -->
<!-- This section collects the simplified delivery details required by the brief. -->
<h2>Delivery Details</h2>
<form id="checkout-form">
    <label for="checkout-email">Email</label><br>
    <input id="checkout-email" name="email" type="email" required><br><br>

    <label for="checkout-phone">Phone Number</label><br>
    <input id="checkout-phone" name="phone" type="tel" required><br><br>

    <label for="checkout-suburb">Suburb</label><br>
    <input id="checkout-suburb" name="suburb" type="text" required><br><br>

    <button type="submit">Complete Sale</button>
</form>

<!-- This message area displays checkout validation messages and success responses. -->
<p id="checkout-message"></p>

<button onclick="clearCart()">
Clear Cart
</button>

<p>
    <a href="admin.html">Admin Sales Summary</a>
</p>

<script src="cart.js"></script>
<script src="cartDisplay.js"></script>

</body>
</html>
